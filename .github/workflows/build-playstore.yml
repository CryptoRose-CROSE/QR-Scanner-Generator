name: Build & Publish Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'QR Scanner & Generator Pro v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release Bundle (.aab) and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Release AAB (Play Store Bundle)
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Build Release APK (Direct Install)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_assets
        run: |
          mkdir -p release-dist
          cp app/build/outputs/bundle/release/*.aab release-dist/app-release.aab
          cp app/build/outputs/apk/release/*.apk release-dist/app-release.apk
          
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload Artifacts to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: google-play-and-installable-release
          path: release-dist/*
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag }}
          name: ${{ github.event.inputs.release_title || steps.prepare_assets.outputs.tag }}
          body: |
            ## 🚀 QR Scanner & Generator Pro Release
            
            This automated release includes production-ready signed binaries.
            
            ### 📦 Assets Included:
            * **`app-release.aab`**: Google Play Store Android App Bundle (Upload directly to Google Play Console).
            * **`app-release.apk`**: Release APK for direct installation on Android devices.
            
            ### 🔐 Signing Details:
            * **Signed with**: Production Keystore (`release.keystore`)
            * **Signature Schemes**: APK Signature Scheme v1, v2, v3, v4
          draft: false
          prerelease: false
          files: |
            release-dist/app-release.aab
            release-dist/app-release.apk
